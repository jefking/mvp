name: api-blob-storage-loadtest

services:
  loadtest:
    image: node:24-bookworm-slim
    init: true
    command: sleep infinity
    working_dir: /workspaces/api-blob-storage
    volumes:
      - ..:/workspaces/api-blob-storage
    depends_on:
      - minio

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: minio-load-test
      MINIO_ROOT_PASSWORD: minio-load-test-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - type: tmpfs
        target: /data
        tmpfs:
          size: 1073741824
          mode: 1777
